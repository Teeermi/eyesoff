name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/eyesoff${{ matrix.ext }}" "eyesoff-${{ matrix.target }}${{ matrix.ext }}"
          gh release upload "$GITHUB_REF_NAME" "eyesoff-${{ matrix.target }}${{ matrix.ext }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: runner.os == 'Linux'
        run: |
          arch=$(dpkg --print-architecture)
          mkdir -p deb/DEBIAN deb/usr/bin
          cp "target/${{ matrix.target }}/release/eyesoff" deb/usr/bin/
          cat > deb/DEBIAN/control <<EOF
          Package: eyesoff
          Version: ${GITHUB_REF_NAME#v}
          Architecture: $arch
          Maintainer: Termi <173885477+Teeermi@users.noreply.github.com>
          Homepage: https://github.com/Teeermi/eyesoff
          Section: utils
          Priority: optional
          Description: Keeps secrets out of what your coding agent sends to the model
          EOF
          dpkg-deb --build --root-owner-group deb "eyesoff_$arch.deb"
          gh release upload "$GITHUB_REF_NAME" "eyesoff_$arch.deb" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
