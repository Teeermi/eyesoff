<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Claude Code sends text and screenshots to eyesoff on 127.0.0.1:8787, which strips secrets before forwarding to api.anthropic.com; responses pass back untouched.">
  <title>eyesoff request flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="229" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- flow -->
  <rect x="20" y="45" width="150" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="75" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#1f2328">Claude Code</text>

  <rect x="285" y="30" width="180" height="80" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="375" y="64" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1f2328">eyesoff</text>
  <text x="375" y="84" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">127.0.0.1:8787</text>

  <rect x="560" y="45" width="140" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="75" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#1f2328">api.anthropic.com</text>

  <line x1="176" y1="70" x2="279" y2="70" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="227" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">text + screenshots</text>

  <line x1="471" y1="70" x2="554" y2="70" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#57606a">cleaned request</text>

  <!-- what eyesoff does -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" xml:space="preserve">
    <rect x="20" y="145" width="7" height="7" fill="#1f2328"/>
    <text x="34" y="151" fill="#57606a"><tspan font-weight="700" fill="#1f2328">text</tspan><tspan> &#8594; secret-looking strings become </tspan><tspan font-weight="700" fill="#1f2328">[hidden by eyesoff]</tspan></text>

    <rect x="20" y="173" width="7" height="7" fill="#1f2328"/>
    <text x="34" y="179" fill="#57606a"><tspan font-weight="700" fill="#1f2328">screenshots</tspan><tspan> &#8594; keys found with macOS Vision get </tspan><tspan font-weight="700" fill="#1f2328">boxed out</tspan></text>

    <rect x="20" y="201" width="7" height="7" fill="#1f2328"/>
    <text x="34" y="207" fill="#57606a"><tspan font-weight="700" fill="#1f2328">responses</tspan><tspan> &#8594; passed through untouched</tspan></text>
  </g>
</svg>
